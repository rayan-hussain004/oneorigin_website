<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #070b16;
            --card: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
            --muted: #94a3b8;
            --accent: #7c3aed;
            --accent2: #06b6d4;
        }
        body {
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(124, 58, 237, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(6, 182, 212, 0.18),
                    transparent 35%
                ),
                var(--bg);
        }
        /* Animated background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }
        .orb {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: float 12s ease-in-out infinite alternate;
        }
        .orb.one {
            background: #7c3aed;
            top: -120px;
            left: -100px;
        }
        .orb.two {
            background: #06b6d4;
            right: -120px;
            bottom: -100px;
            animation-delay: -5s;
        }
        @keyframes float {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(80px, -40px);
            }
        }
        /* Main */
        .container {
            width: min(1100px, 92%);
            padding: 50px 20px;
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #c4b5fd;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 24px;
            backdrop-filter: blur(12px);
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 12px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.35;
                transform: scale(0.75);
            }
        }
        h1 {
            font-size: clamp(40px, 7vw, 80px);
            line-height: 1.05;
            margin-bottom: 18px;
            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #c4b5fd,
                    #67e8f9
                );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            max-width: 650px;
            margin: auto;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 45px;
        }
        /* Countdown */
        .countdown {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 18px;

            max-width: 850px;

            margin: auto;
        }

        .time-card {
            position: relative;

            padding: 30px 15px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 22px;

            backdrop-filter: blur(20px);

            overflow: hidden;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;
        }

        .time-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--accent),
                    var(--accent2),
                    transparent
                );
        }

        .time-card:hover {
            transform: translateY(-7px);

            border-color:
                rgba(124, 58, 237, 0.5);

            background:
                rgba(255, 255, 255, 0.10);
        }

        .number {
            font-size: clamp(42px, 6vw, 65px);

            font-weight: 700;

            line-height: 1;

            letter-spacing: -2px;
        }

        .label {
            margin-top: 12px;

            color: var(--muted);

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 2px;
        }

        /* Progress */

        .progress-section {
            max-width: 850px;

            margin: 40px auto 0;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;

            margin-bottom: 10px;

            color: var(--muted);

            font-size: 13px;
        }

        .progress-bar {
            height: 8px;

            overflow: hidden;

            background:
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--accent),
                    var(--accent2)
                );

            box-shadow:
                0 0 20px
                rgba(124, 58, 237, 0.5);

            transition: width 1s linear;
        }

        /* Target */

        .target {
            margin-top: 35px;

            color: var(--muted);

            font-size: 14px;
        }

        .target strong {
            color: white;
            font-weight: 500;
        }

        /* Finished */

        #finished {
            display: none;

            padding: 35px;

            border: 1px solid
                rgba(34, 197, 94, 0.3);

            border-radius: 20px;

            background:
                rgba(34, 197, 94, 0.08);

            color: #86efac;

            font-size: 24px;
            font-weight: 600;
        }

        /* Footer */

        .footer {
            margin-top: 45px;

            color: #64748b;

            font-size: 12px;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .container {
                padding: 35px 10px;
            }

            .countdown {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

            .time-card {
                padding: 25px 10px;
            }

            .subtitle {
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {

            .number {
                font-size: 38px;
            }

            .label {
                font-size: 10px;
            }
        }

        /* Reduced motion */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>


<body>

    <div class="background">
        <div class="orb one"></div>
        <div class="orb two"></div>
    </div>


    <main class="container">
<!--
        <div class="badge">
            <span class="badge-dot"></span>
            Countdown Active
        </div>

    -->
        <h1 id="title">
            HAFSA
        </h1>


        <p class="subtitle">
            The countdown is running...
        </p>


        <section class="countdown" id="countdown">

            <div class="time-card">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>

            <div class="time-card">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>

            <div class="time-card">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>

            <div class="time-card">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>

        </section>


        <section class="progress-section">

            <div class="progress-header">
                <span>Progress</span>
                <span id="progressText">0%</span>
            </div>

            <div class="progress-bar">
                <div
                    class="progress-fill"
                    id="progressFill">
                </div>
            </div>

        </section>


        <div class="target">
            Target:
            <strong id="targetDisplay"></strong>
        </div>


        <div id="finished">
            🎉 The countdown has reached zero!
        </div>


        <div class="footer">
            The countdown updates automatically every second.
        </div>

    </main>


    <script>

        /* =====================================================
           CHANGE ONLY THIS SECTION
           ===================================================== */

        const targetDate =
            new Date("2026-12-10T23:59:59");

        const countdownTitle =
            "HAFSA";


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const daysElement =
            document.getElementById("days");

        const hoursElement =
            document.getElementById("hours");

        const minutesElement =
            document.getElementById("minutes");

        const secondsElement =
            document.getElementById("seconds");

        const countdownElement =
            document.getElementById("countdown");

        const finishedElement =
            document.getElementById("finished");

        const progressFill =
            document.getElementById("progressFill");

        const progressText =
            document.getElementById("progressText");

        const targetDisplay =
            document.getElementById("targetDisplay");

        const titleElement =
            document.getElementById("title");


        /* =====================================================
           TITLE
           ===================================================== */

        titleElement.textContent =
            countdownTitle;


        /* =====================================================
           DISPLAY TARGET DATE
           ===================================================== */

        targetDisplay.textContent =
            targetDate.toLocaleString(
                undefined,
                {
                    dateStyle: "long",
                    timeStyle: "short"
                }
            );


        /* =====================================================
           CALCULATE START DATE
           
           Used only for the progress indicator.
           
           It automatically uses the current date when
           the page is opened.
           ===================================================== */

        const startDate = new Date();


        /* =====================================================
           FORMAT NUMBER
           ===================================================== */

        function formatNumber(number) {

            return String(number).padStart(2, "0");

        }


        /* =====================================================
           UPDATE COUNTDOWN
           ===================================================== */

        function updateCountdown() {

            const now = new Date();

            const difference =
                targetDate.getTime() -
                now.getTime();


            /* Target reached */

            if (difference <= 0) {

                daysElement.textContent = "00";
                hoursElement.textContent = "00";
                minutesElement.textContent = "00";
                secondsElement.textContent = "00";

                countdownElement.style.display =
                    "none";

                document.querySelector(
                    ".progress-section"
                ).style.display = "none";

                document.querySelector(
                    ".target"
                ).style.display = "none";

                finishedElement.style.display =
                    "block";

                return;

            }


            /* Time calculations */

            const totalSeconds =
                Math.floor(difference / 1000);

            const days =
                Math.floor(
                    totalSeconds / 86400
                );

            const hours =
                Math.floor(
                    (totalSeconds % 86400) / 3600
                );

            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );

            const seconds =
                totalSeconds % 60;


            /* Update numbers */

            daysElement.textContent =
                formatNumber(days);

            hoursElement.textContent =
                formatNumber(hours);

            minutesElement.textContent =
                formatNumber(minutes);

            secondsElement.textContent =
                formatNumber(seconds);


            /* =================================================
               PROGRESS

               This shows progress from the moment the page
               was first opened until the target date.
               ================================================= */

            const totalDuration =
                targetDate.getTime() -
                startDate.getTime();

            const elapsed =
                now.getTime() -
                startDate.getTime();

            let progress =
                (elapsed / totalDuration) * 100;


            progress =
                Math.max(
                    0,
                    Math.min(100, progress)
                );


            progressFill.style.width =
                progress + "%";

            progressText.textContent =
                progress.toFixed(1) + "%";

        }


        /* =====================================================
           INITIAL UPDATE
           ===================================================== */

        updateCountdown();


        /* =====================================================
           UPDATE EVERY SECOND
           ===================================================== */

        const timer =
            setInterval(
                updateCountdown,
                1000
            );


        /* =====================================================
           CLEAN UP WHEN PAGE IS HIDDEN

           Reduces unnecessary work when the tab isn't active.
           ===================================================== */

        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    updateCountdown();

                }

            }
        );

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070b16;
            --card: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
            --muted: #94a3b8;
            --accent: #7c3aed;
            --accent2: #06b6d4;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(124, 58, 237, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(6, 182, 212, 0.18),
                    transparent 35%
                ),
                var(--bg);
        }

        /* =====================================================
           BACKGROUND
           ===================================================== */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        /* =====================================================
           MAIN
           ===================================================== */

        .container {
            width: min(1100px, 92%);
            min-height: 100vh;
            margin: auto;
            padding: 45px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #c4b5fd;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 12px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.35;
                transform: scale(0.75);
            }
        }

        h1 {
            font-size: clamp(40px, 7vw, 80px);
            line-height: 1.05;
            margin-bottom: 12px;
            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #c4b5fd,
                    #67e8f9
                );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            max-width: 650px;
            margin: 0 auto 28px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.6;
        }

        /* =====================================================
           CENTER SLIDESHOW
           ===================================================== */

        .slideshow {
            width: min(760px, 92vw);
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(0, 0, 0, 0.2);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.35),
                0 0 50px rgba(124, 58, 237, 0.12);
            margin-bottom: 26px;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.8s ease;
            filter: none;
            background: #070b16;
        }

        .slide.active {
            opacity: 1;
        }

        .slide-controls {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
        }

        .dot {
            width: 9px;
            height: 9px;
            border: 0;
            border-radius: 50%;
            padding: 0;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.45);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .dot.active {
            background: white;
            transform: scale(1.25);
        }

        /* =====================================================
           COUNTDOWN
           ===================================================== */

        .countdown {
            width: min(850px, 100%);
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .time-card {
            position: relative;
            padding: 25px 15px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            backdrop-filter: blur(20px);
            overflow: hidden;
            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;
        }

        .time-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--accent),
                    var(--accent2),
                    transparent
                );
        }

        .time-card:hover {
            transform: translateY(-7px);
            border-color: rgba(124, 58, 237, 0.5);
            background: rgba(255, 255, 255, 0.10);
        }

        .number {
            font-size: clamp(42px, 6vw, 65px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
        }

        .label {
            margin-top: 12px;
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* =====================================================
           PROGRESS
           ===================================================== */

        .progress-section {
            width: min(850px, 100%);
            margin: 30px auto 0;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .progress-bar {
            height: 8px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background:
                linear-gradient(
                    90deg,
                    var(--accent),
                    var(--accent2)
                );
            box-shadow:
                0 0 20px
                rgba(124, 58, 237, 0.5);
            transition: width 1s linear;
        }

        .target {
            margin-top: 25px;
            color: var(--muted);
            font-size: 14px;
        }

        .target strong {
            color: white;
            font-weight: 500;
        }

        /* =====================================================
           FINISHED
           ===================================================== */

        #finished {
            display: none;
            width: min(850px, 100%);
            padding: 35px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.08);
            color: #86efac;
            font-size: 24px;
            font-weight: 600;
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {
            .container {
                width: 100%;
                padding: 30px 14px;
            }

            .slideshow {
                width: 100%;
                aspect-ratio: 4 / 3;
                border-radius: 18px;
                margin-bottom: 18px;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .time-card {
                padding: 22px 10px;
            }

            .subtitle {
                font-size: 16px;
                margin-bottom: 22px;
            }

            .progress-section {
                margin-top: 22px;
            }
        }

        @media (max-width: 380px) {
            .number {
                font-size: 38px;
            }

            .label {
                font-size: 10px;
            }

            h1 {
                font-size: 42px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

    <script>
        /* =====================================================
           CHANGE ONLY THIS SECTION
           ===================================================== */

        const targetDate =
            new Date("2026-12-10T23:59:59");

        const countdownTitle =
            "HAFSA";

        /*
         * Slideshow settings
         *
         * Change this number to control how long
         * each image stays on screen.
         *
         * 3000 = 3 seconds
         * 5000 = 5 seconds
         * 7000 = 7 seconds
         */
        const slideshowInterval = 5000;


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const daysElement =
            document.getElementById("days");

        const hoursElement =
            document.getElementById("hours");

        const minutesElement =
            document.getElementById("minutes");

        const secondsElement =
            document.getElementById("seconds");

        const countdownElement =
            document.getElementById("countdown");

        const finishedElement =
            document.getElementById("finished");

        const progressFill =
            document.getElementById("progressFill");

        const progressText =
            document.getElementById("progressText");

        const targetDisplay =
            document.getElementById("targetDisplay");

        const titleElement =
            document.getElementById("title");

        const slides =
            Array.from(
                document.querySelectorAll(".slide")
            );

        const slideControls =
            document.getElementById("slideControls");


        /* =====================================================
           TITLE
           ===================================================== */

        titleElement.textContent =
            countdownTitle;


        /* =====================================================
           DISPLAY TARGET DATE
           ===================================================== */

        targetDisplay.textContent =
            targetDate.toLocaleString(
                undefined,
                {
                    dateStyle: "long",
                    timeStyle: "short"
                }
            );


        /* =====================================================
           CALCULATE START DATE
           ===================================================== */

        const startDate = new Date();


        /* =====================================================
           FORMAT NUMBER
           ===================================================== */

        function formatNumber(number) {
            return String(number).padStart(2, "0");
        }


        /* =====================================================
           SLIDESHOW
           ===================================================== */

        let currentSlide = 0;
        let slideshowTimer = null;

        function showSlide(index) {

            if (!slides.length) {
                return;
            }

            currentSlide =
                (index + slides.length) %
                slides.length;

            slides.forEach(
                (slide, slideIndex) => {
                    slide.classList.toggle(
                        "active",
                        slideIndex === currentSlide
                    );
                }
            );

            const dots =
                slideControls.querySelectorAll(".dot");

            dots.forEach(
                (dot, dotIndex) => {
                    dot.classList.toggle(
                        "active",
                        dotIndex === currentSlide
                    );
                }
            );
        }


        function createSlideControls() {

            slides.forEach(
                (slide, index) => {

                    const dot =
                        document.createElement("button");

                    dot.type = "button";
                    dot.className = "dot";
                    dot.setAttribute(
                        "aria-label",
                        "Show image " + (index + 1)
                    );

                    dot.addEventListener(
                        "click",
                        () => {

                            showSlide(index);

                            restartSlideshow();

                        }
                    );

                    slideControls.appendChild(dot);
                }
            );

            showSlide(0);
        }


        function nextSlide() {
            showSlide(currentSlide + 1);
        }


        function startSlideshow() {

            if (slides.length <= 1) {
                return;
            }

            slideshowTimer =
                setInterval(
                    nextSlide,
                    slideshowInterval
                );
        }


        function restartSlideshow() {

            if (slideshowTimer) {
                clearInterval(slideshowTimer);
            }

            startSlideshow();
        }


        createSlideControls();
        startSlideshow();


        /* =====================================================
           UPDATE COUNTDOWN
           ===================================================== */

        function updateCountdown() {

            const now = new Date();

            const difference =
                targetDate.getTime() -
                now.getTime();


            /* Target reached */

            if (difference <= 0) {

                daysElement.textContent = "00";
                hoursElement.textContent = "00";
                minutesElement.textContent = "00";
                secondsElement.textContent = "00";

                countdownElement.style.display =
                    "none";

                document.querySelector(
                    ".progress-section"
                ).style.display = "none";

                document.querySelector(
                    ".target"
                ).style.display = "none";

                finishedElement.style.display =
                    "block";

                return;
            }


            /* Time calculations */

            const totalSeconds =
                Math.floor(difference / 1000);

            const days =
                Math.floor(
                    totalSeconds / 86400
                );

            const hours =
                Math.floor(
                    (totalSeconds % 86400) / 3600
                );

            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );

            const seconds =
                totalSeconds % 60;


            /* Update numbers */

            daysElement.textContent =
                formatNumber(days);

            hoursElement.textContent =
                formatNumber(hours);

            minutesElement.textContent =
                formatNumber(minutes);

            secondsElement.textContent =
                formatNumber(seconds);


            /* =================================================
               PROGRESS

               Shows progress from the moment this page
               was opened until the target date.
               ================================================= */

            const totalDuration =
                targetDate.getTime() -
                startDate.getTime();

            const elapsed =
                now.getTime() -
                startDate.getTime();

            let progress =
                (elapsed / totalDuration) * 100;

            progress =
                Math.max(
                    0,
                    Math.min(100, progress)
                );

            progressFill.style.width =
                progress + "%";

            progressText.textContent =
                progress.toFixed(1) + "%";
        }


        /* =====================================================
           INITIAL UPDATE
           ===================================================== */

        updateCountdown();


        /* =====================================================
           UPDATE EVERY SECOND
           ===================================================== */

        const timer =
            setInterval(
                updateCountdown,
                1000
            );


        /* =====================================================
           CLEAN UP WHEN PAGE IS HIDDEN
           ===================================================== */

        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    document.visibilityState ===
                    "visible"
                ) {
                    updateCountdown();
                }

            }
        );
    </script>
